spring.application.name=reliable-event-processor
spring.datasource.url=jdbc:postgresql://localhost:5432/event_processor
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ─── Phase 4: Retry & Dead-Letter Configuration ──────────────────────────────
# Maximum processing attempts before an event is moved to DEAD_LETTER
event-processor.retry.max-attempts=3
# Initial delay before first automatic retry (ms)
event-processor.retry.initial-delay-ms=2000
# Exponential backoff multiplier (delay doubles on each retry)
event-processor.retry.multiplier=2.0
# Maximum backoff cap (ms)
event-processor.retry.max-delay-ms=60000

# ─── Retry Worker ─────────────────────────────────────────────────────────────
# Enable/disable the background retry worker
event-processor.worker.enabled=true
# How often the worker polls for eligible RETRY_PENDING events (ms)
event-processor.worker.poll-interval-ms=2000
# Max events to claim per polling cycle
event-processor.worker.batch-size=10

# ─── Admin API ────────────────────────────────────────────────────────────────
# API key required for all /api/v1/admin/** endpoints (X-Admin-API-Key header)
event-processor.admin.api-key=admin-secret-key-12345

# ─── Test Simulation (disabled in production) ─────────────────────────────────
# Set to true only in test/development to trigger simulated transient failures
simulation.enabled=false

# ─── Phase 5: Kafka Configuration ─────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# ─── Phase 5: Outbox Publisher ────────────────────────────────────────────────
event-processor.outbox.enabled=true
event-processor.outbox.topic=inventory-events
event-processor.outbox.poll-interval-ms=2000
event-processor.outbox.batch-size=10
event-processor.outbox.max-retries=3
event-processor.outbox.stale-claim-seconds=300

# ─── Phase 5: Kafka Consumer ──────────────────────────────────────────────────
event-processor.consumer.enabled=true
event-processor.consumer.group-id=event-processor-group
event-processor.consumer.dlt-topic=inventory-events-dlt
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ─── Phase 6: Observability, Metrics & Actuator ──────────────────────────────
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}